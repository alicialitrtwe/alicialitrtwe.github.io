<!doctype html><meta charset="utf-8"><title>probe2</title>
<style>html,body{margin:0}iframe{width:1280px;height:900px;border:0;display:block}</style>
<div id="out" style="font:12px monospace;white-space:pre"></div>
<script>
const p = 'research/dbs.html';
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function run(){
  let log = '';
  const f = document.createElement('iframe');
  f.src = '/' + p;
  document.body.appendChild(f);
  await new Promise(r => f.onload = r);
  await sleep(800);
  const w = f.contentWindow, d = f.contentDocument;
  const nav = d.querySelector('.paper-nav');
  function cur(){ const c = nav.querySelector('a[aria-current="true"]'); return c?c.getAttribute('href'):'NONE'; }
  log += 'at top: ' + cur() + '\n';
  const max = d.documentElement.scrollHeight - w.innerHeight;
  for (let y = 0; y <= max; y += 200) {
    w.scrollTo(0, y);
    await sleep(80);
    log += 'y=' + y + ' -> ' + cur() + '\n';
  }
  w.scrollTo(0, max); await sleep(300);
  log += 'y=MAX(' + max + ') -> ' + cur() + '\n';
  document.getElementById('out').textContent = log;
}
run();
</script>
